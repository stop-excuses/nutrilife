name: Refresh Pazarko Catalog

# Pazarko fills in stores where our direct scrapers are weak or missing:
#   - Billa     — SPA; our requests-based scraper can't get images
#   - TMarket   — fills in the ~12% the direct scraper misses
#   - Metro     — no direct scraper at all (+11K products)
#   - BulMag    — no direct scraper at all (+19K products)
#   - Avanti    — no direct scraper at all (+2K products)
# (Fantastico/Dar/CBA are listed in pazarko's llms.txt but the /api/products
#  endpoint currently returns 0 rows for them, so we don't query.)
# Kept on a low-frequency schedule with randomized start time so the request
# pattern stays unremarkable.

on:
  schedule:
    # Sunday 09:00–10:00 Sofia (06:00 UTC) — once a week is enough; their
    # catalog updates daily but our 88-99% direct coverage covers diffs.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      stores:
        description: "Comma-separated pazarko stores (e.g. Billa,Metro). Default = Billa,Fantastico,Metro,TMarket"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Random delay (0–55 min) so request time isn't constant
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 3300))
          echo "Sleeping ${DELAY}s before starting..."
          sleep $DELAY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch from pazarko
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ -n "${{ github.event.inputs.stores }}" ]; then
            python scraper/pazarko_scraper.py --stores "${{ github.event.inputs.stores }}"
          else
            python scraper/pazarko_scraper.py
          fi

      - name: Enrich existing products with pazarko image URLs
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/enrich_offers_with_pazarko.py

      - name: Import Metro (and other pazarko-only) products
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/import_pazarko_products.py

      - name: Rebuild .js bundles
        run: python sync_offers.py

      - name: Validate
        run: |
          python3 - <<'EOF'
          import json
          with open("data/market_memory.json", encoding="utf-8") as f:
              mm = json.load(f)
          ps = mm.get("products", [])
          by_store = {}
          for p in ps:
              by_store[p.get("store") or "?"] = by_store.get(p.get("store") or "?", 0) + 1
          print(f"Total products: {len(ps)}")
          for s, n in sorted(by_store.items(), key=lambda x: -x[1]):
              print(f"  {s:12s} {n}")
          if len(ps) < 15000:
              raise SystemExit(f"ERROR: only {len(ps)} products — sync likely failed")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "Ivan.Milev"
          git config user.email "ivvmilev@gmail.com"
          git add data/pazarko.json data/market_memory.json data/market_memory.js data/all_products.json data/all_products.js
          git diff --cached --quiet && echo "No changes" || (
            git commit -m "chore: refresh pazarko catalog $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin master
            git push
          )
