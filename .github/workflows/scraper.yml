name: Scrape Offers

on:
  schedule:
    # Thursday — Kaufland, Billa, Fantastico, Dar publish new catalogs
    - cron: "0 4 * * 4"   # 07:00 Sofia
    - cron: "0 6 * * 4"   # 09:00 Sofia
    - cron: "0 8 * * 4"   # 11:00 Sofia
    - cron: "0 10 * * 4"  # 13:00 Sofia
    - cron: "0 12 * * 4"  # 15:00 Sofia
    - cron: "0 13 * * 4"  # 16:00 Sofia
    - cron: "0 15 * * 4"  # 18:00 Sofia
    - cron: "0 17 * * 4"  # 20:00 Sofia
    # Friday — fallback for catalogs that publish late on Thursday
    - cron: "0 4 * * 5"   # 07:00 Sofia
    - cron: "0 8 * * 5"   # 11:00 Sofia
    - cron: "0 12 * * 5"  # 15:00 Sofia
    # Sunday — Lidl publishes next week's catalog; Kaufland often rolls after the weekend
    - cron: "0 9 * * 0"   # 12:00 Sofia
    - cron: "0 11 * * 0"  # 14:00 Sofia
    - cron: "0 13 * * 0"  # 16:00 Sofia
    - cron: "0 15 * * 0"  # 18:00 Sofia
    - cron: "0 17 * * 0"  # 20:00 Sofia
    - cron: "0 19 * * 0"  # 22:00 Sofia
    # Monday — T-Market/Kaufland publish new catalogs; retry often because publishing time moves
    - cron: "0 4 * * 1"   # 07:00 Sofia
    - cron: "0 5 * * 1"   # 08:00 Sofia
    - cron: "0 6 * * 1"   # 09:00 Sofia
    - cron: "0 7 * * 1"   # 10:00 Sofia
    - cron: "0 9 * * 1"   # 12:00 Sofia
    - cron: "0 11 * * 1"  # 14:00 Sofia
    - cron: "0 13 * * 1"  # 16:00 Sofia
    - cron: "0 15 * * 1"  # 18:00 Sofia
    - cron: "0 17 * * 1"  # 20:00 Sofia
    # Tuesday — late fallback for Monday catalogs that appear after the first day
    - cron: "0 4 * * 2"   # 07:00 Sofia
    - cron: "0 6 * * 2"   # 09:00 Sofia
    - cron: "0 8 * * 2"   # 11:00 Sofia
    - cron: "0 10 * * 2"  # 13:00 Sofia
    - cron: "0 12 * * 2"  # 15:00 Sofia
    - cron: "0 15 * * 2"  # 18:00 Sofia
  workflow_dispatch:
    inputs:
      stores:
        description: "Stores to scrape (e.g. kaufland,lidl or all)"
        required: false
        default: "all"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Determine stores by day
        id: stores
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stores=${{ github.event.inputs.stores }}" >> $GITHUB_OUTPUT
          else
            DAY=$(date -u +%u)  # 1=Mon ... 4=Thu ... 7=Sun
            case $DAY in
              4|5) echo "stores=kaufland,billa,fantastico,dar" >> $GITHUB_OUTPUT ;;
              7) echo "stores=lidl,kaufland" >> $GITHUB_OUTPUT ;;
              1|2) echo "stores=tmarket,kaufland" >> $GITHUB_OUTPUT ;;
              *) echo "stores=all"    >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Run scraper
        run: |
          cd scraper
          python scraper.py --store ${{ steps.stores.outputs.stores }}
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate output
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("data/offers.json", encoding="utf-8") as f:
              data = json.load(f)
          total = data.get("total_offers", 0)
          stores = data.get("stores", [])
          print(f"Offers: {total} | Stores: {stores}")
          if total < 100:
              print(f"ERROR: only {total} offers — scraper likely failed")
              sys.exit(1)
          print("Validation passed.")
          EOF

      - name: Sync offers.json → offers.js
        run: python sync_offers.py

      - name: Commit and push if changed
        run: |
          git config user.name "Ivan.Milev"
          git config user.email "ivvmilev@gmail.com"
          git add data/offers.json data/offers.js data/all_products.json data/all_products.js
          [ -f data/scraper_stats.json ] && git add data/scraper_stats.json || true
          git diff --cached --quiet && echo "No changes — offers unchanged" || (
            git commit -m "chore: update offers [${{ steps.stores.outputs.stores }}] $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin master
            git push
          )
