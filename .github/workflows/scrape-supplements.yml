name: Scrape Supplements

concurrency:
  group: scrape-supplements
  cancel-in-progress: false

on:
  schedule:
    # Every Sunday at 06:00 UTC (09:00 Sofia)
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      categories:
        description: "Categories to scrape (comma-separated, or 'all')"
        required: false
        default: "all"
      sources:
        description: "Sources to scrape (comma-separated, or 'all')"
        required: false
        default: "all"
      per_category:
        description: "Max products per category per source (default: unlimited)"
        required: false
        default: "9999"
      full_refresh_days:
        description: "Full page refresh age in days (0 = force full scan; default: 30)"
        required: false
        default: "30"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Build scraper args
        id: args
        run: |
          CATS="${{ github.event.inputs.categories || 'all' }}"
          SRCS="${{ github.event.inputs.sources || 'all' }}"
          PER="${{ github.event.inputs.per_category || '9999' }}"
          FULL="${{ github.event.inputs.full_refresh_days || '30' }}"
          CONCURRENCY=20

          ARGS="--per-category $PER --concurrency $CONCURRENCY --merge-existing --replace-scope --full-refresh-days $FULL"

          if [ "$CATS" != "all" ]; then
            for cat in $(echo $CATS | tr ',' ' '); do
              ARGS="$ARGS --category $cat"
            done
          fi

          if [ "$SRCS" != "all" ]; then
            for src in $(echo $SRCS | tr ',' ' '); do
              ARGS="$ARGS --source $src"
            done
          fi

          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "Scraper args: $ARGS"

      - name: Run supplement scraper
        run: python scraper/supplement_scrapers.py ${{ steps.args.outputs.args }}
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate output
        run: |
          EXPECTED_SOURCES="${{ github.event.inputs.sources || 'all' }}"
          export EXPECTED_SOURCES
          python3 - <<'EOF'
          import json, os, subprocess, sys
          with open("data/supplements.json", encoding="utf-8") as f:
              data = json.load(f)
          total = data.get("total_supplements", 0)
          sources = set(data.get("sources", []))
          expected_sources = os.environ.get("EXPECTED_SOURCES", "all")
          previous = json.loads(subprocess.check_output(["git", "show", "HEAD:data/supplements.json"], text=True))
          previous_total = previous.get("total_supplements", 0)
          previous_sources = set(previous.get("sources", []))
          print(f"Supplements: {total} | Sources: {sources}")
          if total < 200:
              print(f"ERROR: only {total} supplements — scraper likely failed")
              sys.exit(1)
          if expected_sources == "all" and previous_total and total < int(previous_total * 0.8):
              print(f"ERROR: catalog dropped from {previous_total} to {total} products")
              sys.exit(1)
          if expected_sources == "all":
              missing_sources = sorted(previous_sources - sources)
              if missing_sources:
                  print(f"ERROR: previously healthy sources disappeared: {missing_sources}")
                  sys.exit(1)
          print("Validation passed.")
          EOF

      - name: Sync supplements.json → supplements.js
        run: python sync_supplements.py

      - name: Commit and push if changed
        run: |
          git config user.name "Ivan.Milev"
          git config user.email "ivvmilev@gmail.com"
          git add data/supplements.json data/supplements.js
          git diff --cached --quiet && echo "No changes" || (
            COUNT=$(python3 -c "import json; d=json.load(open('data/supplements.json')); print(d.get('total_supplements',0))")
            git commit -m "chore: update supplements [$COUNT products] $(date -u '+%Y-%m-%d')"
            git pull --rebase --autostash -X theirs origin master
            git push
          )
